name: Propose a use case
description: Add a concrete, testable Box agent workflow
title: "Use case: "
body:
  - type: textarea
    id: workflow
    attributes:
      label: Who needs this and what should happen?
      description: Include trigger, source scope, output and success criteria.
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Permissions, dependencies and failure cases
      description: Include Box AI or admin requirements and a synthetic test.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources and attribution
      description: Link primary sources. Clearly label your own proposal or inference.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public contribution
      options:
        - label: This contains no secrets, private documents or customer data.
          required: true
